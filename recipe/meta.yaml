{% set name = "gwcosmo" %}
{% set version = "3.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/gwcosmo-{{ version }}.tar.gz
  sha256: 174373841e895c9b558011f46b4b4a6930dabaf4ebcf303f291e31fc1cc68192

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - setuptools-scm
    - pip
  run:
    - astropy-base
    - python >={{ python_min }}
    - bilby
    - h5py
    - healpy
    - lalsuite
    - ligo-gracedb
    - ligo-segments
    - ligo.skymap <=1.0.7
    - lscsoft-glue
    - matplotlib-base >=2.0
    - numpy <=1.23.5,>=1.19
    - pandas
    - progressbar
    - scipy
    - seaborn
    - tqdm

test:
  imports:
    - gwcosmo
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://lscsoft.docs.ligo.org/gwcosmo/
  summary: A package to estimate cosmological parameters using gravitational-wave observations
  license: GPL-2.0-only
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - transientlunatic
    - CChapmanbird
    - rachelmgray
    - jcbayley
